[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gda-backend"
version = "1.0.0"
description = "Backend FastAPI + Celery para Gemelo Digital Agrícola"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn>=0.47.0",
    "celery>=5.6.0",
    "redis>=6.4.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic>=2.13",
    "email-validator>=2.3",
]
